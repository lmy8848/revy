name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 从源码安装：官方 release 二进制由 go1.24 构建，无法分析 go 1.25 项目
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Desktop module (build + vet)
        run: |
          cd desktop
          go build ./...
          go vet ./...
